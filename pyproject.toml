[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "telco_churn"
version = "0.0.1"
description = "Experimentaci\u00f3n con MLflow para predecir la cancelaci\u00f3n de clientes (Telco Customer Churn)"
authors = [
  { name = "Sebasti\u00e1n Estrada Garc\u00eda" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["telco_churn"]
include = ["pyproject.toml", "telco_churn/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["telco_churn"]
force-sort-within-sections = true

